<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <p class="p">Logo</p>
        </div>
        <div class="themes">
          <span class="circle"></span>
          <i class="fa-solid fa-moon dark"></i>
          <i class="fa-solid fa-sun light"></i>
        </div>
      </nav>
    </header>
    <div class="container">
      <form action="#">
        <div class="first_name">
          <label for="first">First</label>
          <input
            id="first"
            type="text"
            class="name"
            minlength="5"
            maxlength="15"
          />
          <span class="correct">✓</span>
        </div>
        <div class="last_name mame">
          <label for="last">last</label>
          <input
            id="last"
            type="text"
            class="name"
            minlength="5"
            maxlength="15"
          />
          <span class="correct">✓</span>
        </div>

        <div class="gmail">
          <label for="gmail">Email</label>
          <input id="gmail" type="email" class="email" />
          <span class="correct_email">✓</span>
        </div>
        <div class="password">
          <label for="pass">password</label>
          <input id="pass" type="password" class="pass" />
          <span class="correctPass">✓</span>
        </div>
        <div class="confirm">
          <input class="submit btn" type="submit" value="sign Up" />
          <input class="reset btn" type="reset" value="reset" />
        </div>
      </form>
      <div class="options">
        <p>OR</p>
      </div>

      <div class="sign_in">
        <p>log in</p>
        <div class="links">
          <a href="#" title="gmail"><i class="fa-solid fa-envelope"></i></a>
          <a href="#" title="github"><i class="fa-brands fa-github"></i></a>
          <a href="#" title="Linkedin">
            <i class="fa-brands fa-linkedin"></i
          ></a>
        </div>
      </div>
    </div>
    <script src="./js/script.js"></script>
  </body>
</html>
